<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a2f1a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>TIRTAWANA: The Living Isles</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0a0f0a;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container { width: 100%; height: 100%; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="err" style="position:fixed;top:0;left:0;right:0;max-height:40%;overflow:auto;background:rgba(120,0,0,.95);color:#fff;font:12px/1.4 monospace;padding:8px;z-index:9999;display:none;white-space:pre-wrap;"></div>
  <script>
    (function () {
      function show(msg) {
        var d = document.getElementById('err');
        d.style.display = 'block';
        d.textContent += msg + '\n';
      }
      window.addEventListener('error', function (e) {
        show('ERROR: ' + (e.message || e.error) + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('PROMISE: ' + (r && (r.stack || r.message) || r));
      });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
